services:
  apartment-finder:
    build: .
    container_name: apartment-finder
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/apartments.db
    volumes:
      # Persists the SQLite database (price history). No browser runs in this
      # image — see the Dockerfile — so there is no profile directory to keep.
      - apartment-data:/app/data
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/health']
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  apartment-data:
