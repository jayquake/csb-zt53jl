# Apartment finder — scheduled scan + GitHub Pages publish.
#
# How it works, and why:
#
#   GitHub Pages is static hosting — it cannot run Express, cron, Playwright or
#   SQLite. So the work is split: Actions does the scraping and alerting on a
#   schedule, and Pages serves the result as a read-only page.
#
#   import → scan → export → commit → deploy
#
#   The committed data/snapshot.json is what carries price history between
#   runs. Every job starts from a fresh checkout with no database, so without
#   it each morning would treat every listing as brand new and alert on all of
#   them.
#
# Two caveats worth reading before relying on this:
#
#   1. GitHub-hosted runners use Azure datacenter IP ranges, which Radware and
#      Cloudflare challenge far more aggressively than a home connection. Komo
#      needs no browser and worked fine there; Yad2 and Homeless were reliably
#      blocked, returning zero every run. That is why `scan` below runs on a
#      SELF-HOSTED runner instead: same code, same three sources, just from a
#      machine that does not look like a datacenter to Radware.
#
#      This trades Komo's previous 100% GitHub-hosted reliability for
#      three-source coverage: if the self-hosted machine is off or
#      disconnected at cron time, NOTHING scans that morning — Komo included
#      — because the whole job, not just Yad2/Homeless, now needs that runner.
#      The machine needs to be on and connected around 07:30 Asia/Jerusalem
#      (see the schedule note below) for the morning run to happen at all.
#
#   2. GitHub only fires `schedule:` triggers from the repository's DEFAULT
#      branch. On any other branch the cron silently never runs and only
#      `workflow_dispatch` works. This repository's default branch is
#      `gh-pages`, so that is where this file has to live for the morning scan
#      to happen on its own.
#
# Registering the self-hosted runner (one-time, on the machine that will run
# the scan): repo Settings → Actions → Runners → New self-hosted runner, pick
# the OS, and run the config script it gives you with the label
# `apartment-finder` (`./config.sh --labels apartment-finder ...`). Install it
# as a service (the configurator offers `svc.sh install && svc.sh start` on
# Linux/macOS) so it survives a reboot and keeps running unattended.

name: Apartment Finder

on:
  schedule:
    # 04:30 UTC = 07:30 Asia/Jerusalem in IDT (summer, UTC+3).
    # Israel observes DST, so in winter (IST, UTC+2) this lands at 06:30 local.
    # GitHub cron has no timezone support; pick whichever half-year matters
    # more, or add a second entry and guard it in the job.
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Scrape and score but send no notifications
        type: boolean
        default: false
      sources:
        description: Comma-separated sources to scan
        type: string
        default: komo,yad2,homeless

concurrency:
  # Never let two scans overlap — they would both write the snapshot.
  group: apartment-finder
  cancel-in-progress: false

permissions:
  contents: write # committing the snapshot back
  pages: write
  id-token: write

jobs:
  scan:
    # Was ubuntu-latest. See the note above: this needs to be a machine that
    # is not on a datacenter IP range, registered with this label.
    runs-on: [self-hosted, apartment-finder]
    # A self-hosted job that hangs (network drop mid-scan, browser wedged)
    # would otherwise block every later run behind it — the concurrency group
    # below queues rather than cancels. Generous, since a full three-source
    # scan legitimately takes a few minutes, but not unbounded.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apartment-finder

    env:
      # Set at job level, not per step. The Prisma CLI resolves
      # `url = env("DATABASE_URL")` from the schema itself, so it needs this in
      # the real environment — the default in src/config.ts only covers the
      # application code and does not help `prisma generate` or `db push`.
      # Relative to the working directory above.
      DATABASE_URL: file:./data/apartments.db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apartment-finder/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        # Only Yad2 and Homeless need it. `--with-deps` pulls the system
        # libraries the runner does not ship.
        run: npx playwright install --with-deps chromium

      - name: Prepare database
        run: |
          npx prisma generate
          npx prisma db push --skip-generate --accept-data-loss

      - name: Restore previous state
        # No-op on the very first run, when no snapshot exists yet.
        run: npm run snapshot:import

      - name: Scan
        env:
          SOURCES: ${{ github.event.inputs.sources || 'komo,yad2,homeless' }}
          NOTIFY_CHANNELS: ${{ vars.NOTIFY_CHANNELS || 'telegram' }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_WHATSAPP_FROM: ${{ secrets.TWILIO_WHATSAPP_FROM }}
          TWILIO_WHATSAPP_TO: ${{ secrets.TWILIO_WHATSAPP_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          SCRAPE_THROTTLE_MS: '5000'
          LOG_LEVEL: info
        # A blocked source must not lose the run: the scan already failed soft
        # per source, and the snapshot still needs writing and publishing.
        continue-on-error: true
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm run scan:dry
          else
            npm run scan
          fi

      - name: Export snapshot and build the site
        run: npm run snapshot:export

      - name: Report what each source returned
        run: |
          node -e "
            const s = require('./data/snapshot.json');
            const run = s.lastRun || {};
            console.log('## Scan result');
            console.log('- listings:', s.counts.active);
            console.log('- new:', run.new ?? 0, ' drops:', run.drops ?? 0);
            console.log('- per source:', JSON.stringify(run.sourceStats || {}));
            for (const e of run.errors || []) console.log('- error:', e);
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the snapshot and the site
        # Pages on this repository is "deploy from a branch", which serves the
        # root of gh-pages, so the built site is copied there. The `deploy` job
        # below covers "GitHub Actions" mode. Both publish identical content, so
        # the site is right under either setting.
        #
        # Everything written here is a GENERATED file — this run rebuilt it from
        # the restored snapshot plus a fresh scan — so on divergence this copy is
        # authoritative. That is why the branch is reset onto the remote tip and
        # the files re-applied, rather than rebased: a regenerated JSON file
        # conflicts wholesale against any other version of itself, which is
        # exactly how the previous approach died ("CONFLICT (content): Merge
        # conflict in apartment-finder/data/snapshot.json"). There is no
        # meaningful three-way merge of a generated artifact; last writer wins is
        # both correct and the only thing that terminates.
        working-directory: .
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # snapshot.json is tracked, so a hard reset would revert it — keep a
          # copy outside the work tree. The built site/ is gitignored and
          # therefore survives the reset untouched.
          SNAPSHOT_BACKUP="$(mktemp)"
          cp apartment-finder/data/snapshot.json "$SNAPSHOT_BACKUP"

          for attempt in 1 2 3; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            cp "$SNAPSHOT_BACKUP" apartment-finder/data/snapshot.json

            # Copy the whole built site, not a hand-listed set of files. The
            # list silently omitted public/vendor/ (the vendored Leaflet
            # build), which published fine and only broke the map with a 404 in
            # production — the kind of failure a file list invites every time an
            # asset is added.
            cp -R apartment-finder/site/. .

            git add apartment-finder/data/snapshot.json

            # Stage whatever the build produced, by name. Iterating the built
            # directory's own entries means a new asset is picked up without
            # anyone updating this list, and `git add` on a directory stages it
            # recursively, so vendor/ comes along.
            #
            # Deliberately not `find ... -printf` piped into a loop: that form
            # needs a backslash escape that is easy to get wrong in YAML, and
            # when it is wrong every path arrives mangled, `git add` fails, and
            # the pipeline swallows the error so the step still reports success.
            for entry in apartment-finder/site/* apartment-finder/site/.nojekyll; do
              [ -e "$entry" ] || continue
              git add -f "$(basename "$entry")"
            done

            # Nothing changed is a normal outcome, not a failure.
            if git diff --staged --quiet; then
              echo "nothing to publish"
              exit 0
            fi

            git commit -m "chore: apartment snapshot $(date -u +%Y-%m-%d)"

            if git push origin "HEAD:$BRANCH"; then
              echo "published on attempt $attempt"
              exit 0
            fi

            echo "push raced with another commit, retrying ($attempt/3)"
          done

          echo "could not publish after 3 attempts" >&2
          exit 1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apartment-finder/site

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
